<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nonsoop-design-system-cf042971-6136-4011-9b6f-587625369f57/tokens/fonts.css">
<link rel="stylesheet" href="_ds/nonsoop-design-system-cf042971-6136-4011-9b6f-587625369f57/tokens/fig-tokens.css">
<link rel="stylesheet" href="_ds/nonsoop-design-system-cf042971-6136-4011-9b6f-587625369f57/tokens/typography.css">
<link rel="stylesheet" href="_ds/nonsoop-design-system-cf042971-6136-4011-9b6f-587625369f57/tokens/brand.css">
<link rel="stylesheet" href="_ds/nonsoop-design-system-cf042971-6136-4011-9b6f-587625369f57/components/fig-assets.css">
<link rel="stylesheet" href="_ds/nonsoop-design-system-cf042971-6136-4011-9b6f-587625369f57/styles.css">
<script src="_ds/nonsoop-design-system-cf042971-6136-4011-9b6f-587625369f57/_ds_bundle.js"></script>
<style>
html,body{margin:0;padding:0;background:var(--background-secondary)}
a{color:var(--brand-primary)}a:hover{color:var(--brand-primary-hover)}
</style>
</helmet>
<div data-screen-label="제출 확인 모달" style="min-height:100vh;min-width:1280px;background:rgba(17,24,39,0.45);display:flex;align-items:center;justify-content:center;font-family:'Pretendard',sans-serif;letter-spacing:-0.3px;padding:48px 0">
  <div style="width:560px;box-sizing:border-box;background:var(--background-primary);border-radius:20px;box-shadow:0 24px 64px rgba(17,24,39,0.20);padding:36px 36px 32px;display:flex;flex-direction:column;align-items:center;gap:20px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="font-family:'SUIT Variable',sans-serif;font-weight:700;font-size:22px;line-height:1.3;color:var(--text-primary)">답안 제출</div>
      <div style="font-size:15px;font-weight:500;line-height:1.5;color:var(--text-secondary)">제출 전 작성 현황을 확인해주세요.</div>
    </div>
    <div style="display:flex;align-items:center;gap:7px;background:var(--background-tertiary);border-radius:999px;padding:8px 16px">
      <span style="display:flex;align-items:center;color:var(--text-secondary)">
        <x-import component-from-global-scope="DesignSystem_cf0429.IconCustomClock" hint-size="24px,24px"></x-import>
      </span>
      <span style="font-size:14px;font-weight:500;color:var(--text-secondary)">남은 시간</span>
      <span style="font-family:'SUIT Variable',sans-serif;font-weight:700;font-size:14px;color:var(--brand-primary);font-variant-numeric:tabular-nums">01:10:04</span>
    </div>
    <div style="width:100%;border:1px solid var(--border-default);border-radius:12px;overflow:hidden">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div style="{{ r.rowStyle }}">
          <div style="display:flex;align-items:center;gap:12px;min-width:0">
            <span style="font-size:15px;font-weight:600;line-height:1.4;color:var(--text-primary);white-space:nowrap">{{ r.name }}</span>
            <x-import component-from-global-scope="DesignSystem_cf0429.Badge" dc-props="{{ r.badgeProps }}" hint-size="72px,24px"></x-import>
          </div>
          <span style="font-size:13px;font-weight:500;line-height:1.4;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;color:{{ r.noteColor }}">{{ r.noteText }}</span>
        </div>
      </sc-for>
    </div>
    <div style="width:100%;display:flex;align-items:flex-start;gap:8px;background:var(--background-secondary);border-radius:10px;padding:12px 14px">
      <span style="display:flex;flex:none;align-items:center;color:var(--text-tertiary)">
        <x-import component-from-global-scope="DesignSystem_cf0429.IconStatusInfo" dc-props="{{ infoIconProps }}" hint-size="16px,16px"></x-import>
      </span>
      <span style="font-size:13px;font-weight:500;line-height:1.55;color:var(--text-secondary)">{{ noticeText }}</span>
    </div>
    <div style="width:100%;display:flex;justify-content:flex-end;gap:10px;margin-top:2px">
      <div style="cursor:pointer;display:flex">
        <x-import component-from-global-scope="DesignSystem_cf0429.Button" size="lg" type="secondary" dc-props="{{ cancelProps }}" hint-size="124px,52px"></x-import>
      </div>
      <div onClick="{{ onContinue }}" style="cursor:pointer;display:flex">
        <x-import component-from-global-scope="DesignSystem_cf0429.Button" size="lg" type="primary" dc-props="{{ submitProps }}" hint-size="148px,52px"></x-import>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;minChars&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:150,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:50,&quot;max&quot;:500,&quot;step&quot;:10,&quot;unit&quot;:&quot;자&quot;,&quot;section&quot;:&quot;분량 기준&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const MIN = this.props.minChars ?? 150;
    const data = [
      { name: '1번 문제', len: 212 },
      { name: '2번 문제', len: 198 },
      { name: '3번 문제', len: 88 },
      { name: '4번 문제', len: 61 },
      { name: '5번 문제', len: 0 }
    ];
    const rows = data.map((d, i) => {
      const last = i === data.length - 1;
      const rowStyle = 'display:flex;align-items:center;justify-content:space-between;gap:16px;height:56px;box-sizing:border-box;padding:0 18px;' +
        (last ? '' : 'border-bottom:1px solid var(--border-default);');
      let badgeProps, noteColor, noteText;
      if (d.len >= MIN) {
        badgeProps = { size: 'md', type: 'success', text1: '분량 충족' };
        noteColor = 'var(--text-tertiary)';
        noteText = d.len + '자 작성';
      } else {
        noteColor = 'var(--text-error)';
        noteText = MIN + '자 이상 작성해주세요 (현재 ' + d.len + '자)';
        badgeProps = d.len === 0
          ? { size: 'md', type: 'secondary', text1: '미작성', style: { backgroundColor: 'var(--background-tertiary)', color: 'var(--text-secondary)' } }
          : { size: 'md', type: 'error', text1: '분량 미달' };
      }
      return { name: d.name, rowStyle, badgeProps, noteColor, noteText };
    });
    const short = data.filter(d => d.len < MIN);
    const total = short.reduce((s, d) => s + (MIN - d.len), 0);
    return {
      rows,
      noticeText: short.length
        ? '아직 ' + short.length + '개 문제가 최소 분량에 못 미쳐요. 이대로 제출하면 채점되지 않을 수 있어요.'
        : '모든 문제가 최소 분량을 채웠어요. 제출 후에는 답안을 수정할 수 없어요.',
      infoIconProps: { style: { width: 16, height: 16, flexShrink: 0 } },
      cancelProps: { text1: '취소', showLeftIcon: false, showRightIcon: false, style: { width: 124, height: 52 } },
      submitProps: { text1: '답안 제출', showLeftIcon: false, showRightIcon: false, style: { width: 148, height: 52 } },
      onContinue: () => this.props.onContinue && this.props.onContinue()
    };
  }
}
</script>
</body>
</html>
