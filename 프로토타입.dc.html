<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;padding:0;background:#F9FAFB}
</style>
</helmet>
<div data-screen-label="프로토타입" style="position:relative;min-height:100vh;min-width:1280px;background:#F9FAFB">
  <sc-if value="{{ isIntro }}" hint-placeholder-val="{{ true }}">
    <dc-import name="1. 응시 안내 모달" on-start="{{ toCountdown }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isCountdown }}" hint-placeholder-val="{{ false }}">
    <dc-import name="2. 카운트다운" on-done="{{ toExam }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isExam }}" hint-placeholder-val="{{ false }}">
    <dc-import name="3. 응시 화면" on-pause="{{ toPaused }}" on-submit="{{ toSubmit }}" on-exit="{{ toIntro }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isPaused }}" hint-placeholder-val="{{ false }}">
    <dc-import name="4. 일시정지 오버레이" on-resume="{{ toExam }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isSubmit }}" hint-placeholder-val="{{ false }}">
    <dc-import name="5. 제출 확인 모달" on-continue="{{ toExam }}" hint-size="100%,100vh"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { step: 'intro' };
  renderVals() {
    const s = this.state.step;
    const go = step => () => this.setState({ step });
    return {
      isIntro: s === 'intro',
      isCountdown: s === 'countdown',
      isExam: s === 'exam',
      isPaused: s === 'paused',
      isSubmit: s === 'submit',
      toIntro: go('intro'),
      toCountdown: go('countdown'),
      toExam: go('exam'),
      toPaused: go('paused'),
      toSubmit: go('submit')
    };
  }
}
</script>
</body>
</html>
